name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that AudioBoost does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other apps, workarounds, or designs you have tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Audio processing
        - Per-app capture
        - Menu-bar interface
        - Build and packaging
        - Documentation
        - Other
